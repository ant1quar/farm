[include boards/neptune.cfg]
[include core/index.cfg]
[include common/index.cfg]
[include printers/neptune3_pro.cfg]

[extruder]
nozzle_diameter: 0.400
filament_diameter: 1.750
sensor_type: Trianglelab-NTC100K-B3950
rotation_distance: 7.52

[firmware_retraction]
retract_length: 1.76
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 10

[input_shaper]
# Calibrate IS: https://www.klipper3d.org/Resonance_Compensation.html
shaper_type_y = mzv
shaper_freq_y = 40.0 
shaper_type_x = ei
shaper_freq_x = 50.4 

[extruder]
control: pid
pid_Kp: 25.398
pid_Ki: 1.568
pid_Kd: 102.861
pressure_advance = 0.044

[heater_bed]
control: pid
pid_Kp: 69.905
pid_Ki: 1.180
pid_Kd: 1035.462

[probe]
z_offset: 2.405
